name: mini-ntfs

services:
  api:
    build: .
    init: true
    command: ["npm", "run", "dev", "-w", "@mini-ntfs/api"]
    environment:
      MINI_NTFS_API_HOST: "0.0.0.0"
      MINI_NTFS_VOLUME_PATH: /app/data/volume.json
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(response => process.exit(response.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 5

  web:
    build: .
    init: true
    command: ["npm", "run", "dev", "-w", "@mini-ntfs/web", "--", "--host", "0.0.0.0"]
    environment:
      MINI_NTFS_API_PROXY_TARGET: http://api:3001
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      api:
        condition: service_healthy

volumes:
  data:
